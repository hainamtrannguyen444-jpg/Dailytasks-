<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            /* Bạn có thể dễ dàng thay đổi màu chữ/neon và độ mờ nền ở đây */
            --neon-color: #00ffcc; /* Màu chữ & màu viền neon */
            --bg-opacity: 0.65;    /* Độ mờ của nền (từ 0.0 đến 1.0) */
        }

        .time-picker-box {
            /* Nền mờ tự động đồng bộ với độ mờ được cấu hình */
            background: rgba(20, 20, 20, var(--bg-opacity));
            
            /* Viền neon phát sáng cùng màu với chữ */
            border: 2px solid var(--neon-color);
            box-shadow: 0 0 12px var(--neon-color), inset 0 0 8px var(--neon-color);
            
            padding: 20px;
            border-radius: 12px;
            width: 150px;
            text-align: center;
        }

        .time-title {
            color: var(--neon-color);
            text-shadow: 0 0 6px var(--neon-color);
            font-family: Arial, sans-serif;
            margin-bottom: 10px;
            font-weight: bold;
        }

        /* Khung cuộn chọn giờ 24h */
        .wheel-scroll {
            height: 120px;
            overflow-y: scroll;
            scrollbar-width: none; /* Ẩn thanh cuộn trên Firefox */
            border: 1px solid var(--neon-color);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.2);
        }

        .wheel-scroll::-webkit-scrollbar {
            display: none; /* Ẩn thanh cuộn trên Chrome, Safari */
        }

        .wheel-item {
            padding: 8px 0;
            font-size: 20px;
            color: var(--neon-color);
            font-weight: bold;
            cursor: pointer;
        }

        .wheel-item:hover {
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>

    <div class="time-picker-box">
        <div class="time-title">CHỌN GIỜ (24H)</div>
        <div class="wheel-scroll">
            <!-- Vòng lặp từ 00 đến 23 -->
            <div class="wheel-item">00</div>
            <div class="wheel-item">01</div>
            <div class="wheel-item">02</div>
            <div class="wheel-item">03</div>
            <div class="wheel-item">04</div>
            <div class="wheel-item">05</div>
            <div class="wheel-item">06</div>
            <div class="wheel-item">07</div>
            <div class="wheel-item">08</div>
            <div class="wheel-item">09</div>
            <div class="wheel-item">10</div>
            <div class="wheel-item">11</div>
            <div class="wheel-item">12</div>
            <div class="wheel-item">13</div>
            <div class="wheel-item">14</div>
            <div class="wheel-item">15</div>
            <div class="wheel-item">16</div>
            <div class="wheel-item">17</div>
            <div class="wheel-item">18</div>
            <div class="wheel-item">19</div>
            <div class="wheel-item">20</div>
            <div class="wheel-item">21</div>
            <div class="wheel-item">22</div>
            <div class="wheel-item">23</div>
        </div>
    </div>

</body>
</html>
