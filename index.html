<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhiệm vụ hàng ngày & Cửa hàng</title>
    <!-- Thư viện hiệu ứng pháo hoa -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger-color: #ef4444;
            --border-color: #334155;
            --item-bg: rgba(255, 255, 255, 0.03);
        }

        /* Chế độ Sáng (Light Mode) */
        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --danger-color: #dc2626;
            --border-color: #cbd5e1;
            --item-bg: rgba(0, 0, 0, 0.02);
        }

        /* Skin Lửa Cho Hub */
        .flame-skin {
            border: 2px solid #f97316 !important;
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.4);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
            transition: background 0.3s, border 0.3s;
        }

        #lock-screen {
            text-align: center;
        }

        #lock-screen input {
            width: 80%;
            padding: 12px;
            font-size: 18px;
            text-align: center;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            margin-bottom: 15px;
        }

        button {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .stats {
            display: flex;
            gap: 15px;
            font-size: 15px;
            font-weight: bold;
        }

        .fire-streak {
            color: #f97316;
            animation: burn 1.5s infinite alternate;
        }

        @keyframes burn {
            0% { transform: scale(1); text-shadow: 0 0 5px #f97316; }
            100% { transform: scale(1.15); text-shadow: 0 0 15px #ef4444, 0 0 25px #f59e0b; }
        }

        /* Hiệu ứng rung nhẹ khi tích */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            50% { transform: translateX(4px); }
            75% { transform: translateX(-4px); }
            100% { transform: translateX(0); }
        }

        .shake-anim {
            animation: shake 0.3s ease-in-out;
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 10px;
            color: var(--accent-color);
        }

        .task-list, .shop-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
        }

        .task-item, .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--item-bg);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }

        .task-item.completed span {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .delete-btn {
            background: transparent;
            color: var(--danger-color);
            padding: 4px 8px;
            font-size: 14px;
        }
        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .add-task-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .add-task-box input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
        }

        .top-controls {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 10px;
        }

        .icon-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 5px 10px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body id="body-root">

    <div class="container" id="main-container">
        <!-- Khung Nhập Mật Khẩu -->
        <div id="lock-screen">
            <h2>Mật khẩu truy cập</h2>
            <p style="color: #94a3b8; font-size: 14px;">Nhập mã bảo mật để vào ứng dụng</p>
            <input type="password" id="pass-input" placeholder="Nhập mật khẩu (Mặc định: 1234)">
            <br>
            <button onclick="checkPassword()">Truy cập</button>
            <p id="error-msg" style="color: var(--danger-color); margin-top: 10px;"></p>
        </div>

        <!-- Khung Ứng Dụng Chính -->
        <div id="app-screen" class="hidden">
            <div class="top-controls">
                <button class="icon-btn" onclick="toggleTheme()">☀️ / 🌙 Sáng-Tối</button>
            </div>

            <div class="header">
                <div>
                    <h2 style="margin: 0;">Nhiệm Vụ Ngày</h2>
                    <span id="current-date" style="font-size: 12px; color: #94a3b8;"></span>
                </div>
                <div class="stats">
                    <div>🪙 <span id="coins">0</span></div>
                    <div class="fire-streak">🔥 <span id="streak">0</span> ngày</div>
                </div>
            </div>

            <!-- Thêm Nhiệm Vụ Mới -->
            <div class="add-task-box">
                <input type="text" id="new-task-text" placeholder="Thêm nhiệm vụ mới...">
                <button onclick="addNewTask()">Thêm</button>
            </div>

            <div class="section-title">Danh sách nhiệm vụ</div>
            <ul id="task-list" class="task-list"></ul>

            <div class="section-title">Cửa hàng phần thưởng</div>
            <ul id="shop-list" class="shop-list"></ul>
            
            <button onclick="resetData()" style="background: transparent; color: #64748b; font-size: 12px; width: 100%; margin-top: 10px;">Xóa dữ liệu / Đặt lại từ đầu</button>
        </div>
    </div>

    <script>
        const CORRECT_PASS = "1234";

        let appData = JSON.parse(localStorage.getItem('my_daily_app')) || {
            coins: 0,
            streak: 1,
            theme: 'dark',
            flameSkinActive: false,
            lastDate: "",
            tasks: [
                { id: 1, text: "Hoàn thành bài tập về nhà", points: 10, completed: false },
                { id: 2, text: "Đọc sách 20 phút", points: 10, completed: false },
                { id: 3, text: "Dọn dẹp góc học tập", points: 5, completed: false },
                { id: 4, text: "Tập thể dục 15 phút", points: 10, completed: false }
            ],
            shop: [
                { id: 1, name: "30 phút chơi Roblox / Minecraft", cost: 30, type: 'reward' },
                { id: 2, name: "Xem phim / Giải trí 1 tập", cost: 20, type: 'reward' },
                { id: 3, name: "🔥 Mở khóa Skin Viền Lửa Cho Hub", cost: 60, type: 'skin' }
            ]
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'complete') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'buy') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.setValueAtTime(330, audioCtx.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        function checkPassword() {
            const val = document.getElementById('pass-input').value;
            if(val === CORRECT_PASS) {
                document.getElementById('lock-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                initApp();
            } else {
                document.getElementById('error-msg').innerText = "Sai mật khẩu! Thử lại (1234)";
            }
        }

        function initApp() {
            checkDailyReset();
            applyTheme();
            renderUI();
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('vi-VN');
        }

        function toggleTheme() {
            appData.theme = appData.theme === 'dark' ? 'light' : 'dark';
            saveData();
            applyTheme();
        }

        function applyTheme() {
            const root = document.getElementById('body-root');
            const container = document.getElementById('main-container');
            if (appData.theme === 'light') {
                root.setAttribute('data-theme', 'light');
            } else {
                root.removeAttribute('data-theme');
            }

            if (appData.flameSkinActive) {
                container.classList.add('flame-skin');
            } else {
                container.classList.remove('flame-skin');
            }
        }

        function checkDailyReset() {
            const today = new Date().toDateString();
            if (appData.lastDate !== today) {
                appData.tasks.forEach(t => t.completed = false);
                appData.lastDate = today;
                saveData();
            }
        }

        function saveData() {
            localStorage.setItem('my_daily_app', JSON.stringify(appData));
        }

        function renderUI() {
            document.getElementById('coins').innerText = appData.coins;
            document.getElementById('streak').innerText = appData.streak;
            applyTheme();

            const taskUl = document.getElementById('task-list');
            taskUl.innerHTML = '';
            appData.tasks.forEach(task => {
                const li = document.createElement('li');
                li.className = `task-item ${task.completed ? 'completed' : ''}`;
                li.innerHTML = `
                    <div class="task-left">
                        <input type="checkbox" id="chk-${task.id}" ${task.completed ? 'checked' : ''} onclick="toggleTask(${task.id}, event)">
                        <span>${task.text} (+${task.points}đ)</span>
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${task.id})">Xóa</button>
                `;
                taskUl.appendChild(li);
            });

            const shopUl = document.getElementById('shop-list');
            shopUl.innerHTML = '';
            appData.shop.forEach(item => {
                const li = document.createElement('li');
                li.className = 'shop-item';
                li.innerHTML = `
                    <span>${item.name}</span>
                    <button onclick="buyItem(${item.cost}, '${item.type}')">${item.cost} 🪙</button>
                `;
                shopUl.appendChild(li);
            });
        }

        function toggleTask(id, event) {
            const task = appData.tasks.find(t => t.id === id);
            const checkbox = event.target;
            
            // Hiệu ứng rung nhẹ mục tương ứng
            checkbox.classList.add('shake-anim');
            setTimeout(() => checkbox.classList.remove('shake-anim'), 300);

            if (task) {
                task.completed = !task.completed;
                if (task.completed) {
                    appData.coins += task.points;
                    playSound('complete');
                    
                    // Bắn các dải màu lấp lánh nhẹ quanh vị trí tích
                    confetti({
                        particleCount: 30,
                        spread: 50,
                        origin: { y: 0.7 }
                    });
                } else {
                    appData.coins -= task.points;
                }
                saveData();
                renderUI();
                checkAllTasksCompleted();
            }
        }

        function addNewTask() {
            const input = document.getElementById('new-task-text');
            const text = input.value.trim();
            if (!text) return;

            const newTask = {
                id: Date.now(),
                text: text,
                points: 10,
                completed: false
            };
            appData.tasks.push(newTask);
            input.value = '';
            saveData();
            renderUI();
        }

        function deleteTask(id) {
            appData.tasks = appData.tasks.filter(t => t.id !== id);
            saveData();
            renderUI();
        }

        function buyItem(cost, type) {
            if (appData.coins >= cost) {
                appData.coins -= cost;
                playSound('buy');
                
                if (type === 'skin') {
                    appData.flameSkinActive = true;
                    alert("Đã kích hoạt Skin Viền Lửa thành công! Giao diện Hub cực cháy!");
                } else {
                    alert("Đổi phần thưởng thành công! Chúc bạn chơi game vui vẻ!");
                }

                saveData();
                renderUI();
            } else {
                alert("Bạn không đủ xu để đổi phần thưởng này!");
            }
        }

        function checkAllTasksCompleted() {
            if (appData.tasks.length > 0 && appData.tasks.every(t => t.completed)) {
                confetti({
                    particleCount: 150,
                    spread: 90,
                    origin: { y: 0.6 }
                });
            }
        }

        function resetData() {
            if(confirm("Bạn có chắc chắn muốn xóa hết dữ liệu?")) {
                localStorage.removeItem('my_daily_app');
                location.reload();
            }
        }
    </script>
</body>
</html>
